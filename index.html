<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도쿠시마 여행 플래너</title>
  <!-- Tailwind CSS 로드 (반응형 디자인 자동 적용) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 text-slate-800">

  <!-- 상단 헤더 -->
  <header class="max-w-5xl mx-auto bg-indigo-600 text-white rounded-2xl p-6 mb-6 shadow-lg text-center relative">
    <h1 class="text-2xl font-bold">🍊 도쿠시마 여행 플래너</h1>
    <p class="text-sm text-indigo-200 mt-2">2026.08.20 (목) ~ 08.23 (일)</p>
  </header>

  <!-- 메인 레이아웃 (모바일: 세로 1단 / 태블릿,PC: 가로 2단 분리) -->
  <div class="max-w-5xl mx-auto flex flex-col lg:flex-row gap-6">

    <!-- 왼쪽 영역 (항공편 / 숙소 사이드바) -->
    <aside class="w-full lg:w-1/3 flex flex-col gap-4">
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-indigo-100">
        <div class="mb-4 border-b pb-2">
          <h2 class="text-base font-bold text-slate-700 flex items-center gap-2">
            <span>✈️</span> 여행 기본 정보
          </h2>
        </div>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">출국 비행기</label>
            <input type="text" id="flightOut" onblur="saveInfo()" placeholder="예: 8/20 09:00 출발" class="w-full border rounded-xl px-3 py-2 text-sm bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">귀국 비행기</label>
            <input type="text" id="flightIn" onblur="saveInfo()" placeholder="예: 8/23 18:30 출발" class="w-full border rounded-xl px-3 py-2 text-sm bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">숙소 (베이스캠프)</label>
            <input type="text" id="hotelInfo" onblur="saveInfo()" placeholder="숙소 이름이나 주소" class="w-full border rounded-xl px-3 py-2 text-sm bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          </div>
        </div>
        <p class="text-[11px] text-slate-400 mt-3 text-right">* 입력 후 바탕을 누르면 자동 저장</p>
      </section>

      <!-- PC/아이패드용 구글맵 버튼 (왼쪽 하단 고정) -->
      <button onclick="openGoogleMapsRoute()" class="hidden lg:flex w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-md transition items-center justify-center gap-2">
        <span class="text-xl">🗺️</span>
        <span>구글 맵 최적 경로 생성</span>
      </button>
    </aside>

    <!-- 오른쪽 영역 (관광지 선택 및 동선 리스트) -->
    <main class="w-full lg:w-2/3 flex flex-col gap-4">
      
      <!-- 추천 명소 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm">
        <h2 class="text-base font-bold text-slate-700 mb-3 flex items-center gap-2">
          <span>✨</span> 추천 명소 (클릭하여 추가)
        </h2>
        <div class="flex flex-wrap gap-2">
          <button onclick="addSpot('나루토 회오리바람')" class="bg-indigo-50 text-indigo-700 text-sm px-3 py-2 rounded-full hover:bg-indigo-100 font-medium transition">+ 나루토 회오리</button>
          <button onclick="addSpot('오츠카 국제미술관')" class="bg-indigo-50 text-indigo-700 text-sm px-3 py-2 rounded-full hover:bg-indigo-100 font-medium transition">+ 오츠카 미술관</button>
          <button onclick="addSpot('비잔 산 로프웨이')" class="bg-indigo-50 text-indigo-700 text-sm px-3 py-2 rounded-full hover:bg-indigo-100 font-medium transition">+ 비잔 산</button>
          <button onclick="addSpot('아와오도리 회관')" class="bg-indigo-50 text-indigo-700 text-sm px-3 py-2 rounded-full hover:bg-indigo-100 font-medium transition">+ 아와오도리 회관</button>
          <button onclick="addSpot('이야 계곡 카즈라바시')" class="bg-indigo-50 text-indigo-700 text-sm px-3 py-2 rounded-full hover:bg-indigo-100 font-medium transition">+ 이야 계곡</button>
          <button onclick="addSpot('도쿠시마 라멘 거리')" class="bg-indigo-50 text-indigo-700 text-sm px-3 py-2 rounded-full hover:bg-indigo-100 font-medium transition">+ 라멘 거리</button>
        </div>
      </section>

      <!-- 직접 입력란 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm">
        <h2 class="text-base font-bold text-slate-700 mb-3 flex items-center gap-2">
          <span>📌</span> 가고 싶은 곳 직접 입력
        </h2>
        <div class="flex gap-2">
          <!-- 엔터키 입력 지원 -->
          <input type="text" id="spotInput" placeholder="예: 도쿠시마역, 이자카야 등" class="flex-1 border rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <button onclick="addFromInput()" class="bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold hover:bg-indigo-700 transition w-24">추가</button>
        </div>
      </section>

      <!-- 동선 리스트 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
          <h2 class="text-base font-bold text-slate-700 flex items-center gap-2">
            <span>📍</span> 나의 여행 동선
          </h2>
          <button onclick="clearSpots()" class="text-xs text-rose-500 hover:underline font-medium border border-rose-200 px-3 py-1.5 rounded-lg bg-rose-50">동선 초기화</button>
        </div>
        <ul id="spotList" class="space-y-3">
          <!-- JS로 동적 생성되는 항목들 -->
        </ul>
      </section>

      <!-- 모바일용 구글맵 버튼 (스마트폰에서만 하단에 보임) -->
      <button onclick="openGoogleMapsRoute()" class="lg:hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-md transition flex items-center justify-center gap-2 mb-10">
        <span class="text-xl">🗺️</span>
        <span>구글 맵 최적 경로 생성</span>
      </button>

    </main>
  </div>

  <script>
    // 1. 데이터 불러오기 (자동 저장된 내용)
    let spots = JSON.parse(localStorage.getItem('tokushima_spots')) || [];
    let travelInfo = JSON.parse(localStorage.getItem('tokushima_info')) || { flightOut: '', flightIn: '', hotel: '' };

    // 2. 화면 초기화 함수
    function initUI() {
      document.getElementById('flightOut').value = travelInfo.flightOut;
      document.getElementById('flightIn').value = travelInfo.flightIn;
      document.getElementById('hotelInfo').value = travelInfo.hotel;
      renderSpots();
    }

    // 3. 항공편/숙소 정보 저장 (칸에서 벗어날 때 자동 실행)
    function saveInfo() {
      travelInfo = {
        flightOut: document.getElementById('flightOut').value,
        flightIn: document.getElementById('flightIn').value,
        hotel: document.getElementById('hotelInfo').value
      };
      localStorage.setItem('tokushima_info', JSON.stringify(travelInfo));
    }

    // 4. 여행 동선 리스트 그려주기
    function renderSpots() {
      const listEl = document.getElementById('spotList');
      listEl.innerHTML = '';
      
      if (spots.length === 0) {
        listEl.innerHTML = '<li class="text-sm text-slate-400 text-center py-8 bg-slate-50 rounded-xl border border-dashed border-slate-300">등록된 장소가 없습니다. 여행지를 추가해 보세요!</li>';
        return;
      }

      spots.forEach((spot, index) => {
        const li = document.createElement('li');
        li.className = 'flex justify-between items-center bg-white p-3 md:p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition';
        li.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="bg-indigo-100 text-indigo-700 text-sm font-bold w-7 h-7 flex items-center justify-center rounded-full shadow-sm">${index + 1}</span>
            <span class="font-medium text-slate-700 text-sm md:text-base">${spot}</span>
          </div>
          <button onclick="removeSpot(${index})" class="text-slate-400 hover:text-white hover:bg-rose-500 text-xs px-3 py-1.5 rounded-lg transition border border-transparent hover:border-rose-600">삭제</button>
        `;
        listEl.appendChild(li);
      });
    }

    // 5. 장소 추가/삭제 기능
    function addSpot(name) {
      if (!spots.includes(name)) {
        spots.push(name);
        saveSpots();
        renderSpots();
      }
    }

    function addFromInput() {
      const input = document.getElementById('spotInput');
      const val = input.value.trim();
      if (val) {
        addSpot(val);
        input.value = '';
      }
    }

    // 6. 엔터키로 장소 추가하기 이벤트
    document.getElementById('spotInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') addFromInput();
    });

    function removeSpot(index) {
      spots.splice(index, 1);
      saveSpots();
      renderSpots();
    }

    function clearSpots() {
      if (confirm('모든 여행 동선을 삭제하시겠습니까? (항공/숙소 정보는 유지됩니다)')) {
        spots = [];
        saveSpots();
        renderSpots();
      }
    }

    function saveSpots() {
      localStorage.setItem('tokushima_spots', JSON.stringify(spots));
    }

    // 7. 대망의 구글 맵 최적 경로 생성 로직 (숙소가 출발/도착지가 됨)
    function openGoogleMapsRoute() {
      const hotel = travelInfo.hotel ? travelInfo.hotel.trim() : '';

      if (spots.length === 0) {
        if (hotel) {
          if (confirm('여행지가 없습니다. 등록된 숙소 위치를 구글 맵에서 검색하시겠습니까?')) {
            window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('도쿠시마 ' + hotel)}`, '_blank');
          }
        } else {
          alert('동선을 생성할 장소나 숙소를 먼저 추가해주세요!');
        }
        return;
      }

      let origin = '';
      let destination = '';
      let waypointsArray = [];

      // 숙소 정보가 입력되어 있다면, "숙소 -> 목적지들 -> 숙소" 로 왕복 동선 생성
      if (hotel) {
        origin = encodeURIComponent('도쿠시마 ' + hotel);
        destination = encodeURIComponent('도쿠시마 ' + hotel);
        waypointsArray = spots.map(s => '도쿠시마 ' + s);
      } 
      // 숙소 정보가 없다면, "첫번째 목적지 -> 중간 목적지들 -> 마지막 목적지" 로 편도 동선 생성
      else {
        origin = encodeURIComponent('도쿠시마 ' + spots[0]);
        destination = encodeURIComponent('도쿠시마 ' + spots[spots.length - 1]);
        if (spots.length > 2) {
          waypointsArray = spots.slice(1, spots.length - 1).map(s => '도쿠시마 ' + s);
        }
      }

      let waypointsStr = '';
      if (waypointsArray.length > 0) {
        waypointsStr = '&waypoints=' + encodeURIComponent(waypointsArray.join('|'));
      }

      // 대중교통(transit) 기준으로 구글맵 띄우기
      const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypointsStr}&travelmode=transit`;
      window.open(mapsUrl, '_blank');
    }

    // 앱 켜질 때 초기화 함수 실행
    initUI();
  </script>
</body>
</html>
