<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도쿠시마 여행 플래너 (8/20 ~ 8/23)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 max-w-md mx-auto text-slate-800">

  <!-- Header -->
  <header class="bg-indigo-600 text-white rounded-2xl p-5 mb-4 shadow-lg text-center">
    <h1 class="text-xl font-bold">🍊 도쿠시마 여행 플래너</h1>
    <p class="text-xs text-indigo-200 mt-1">2026.08.20 (목) ~ 08.23 (일)</p>
  </header>

  <!-- 추천 명소 선택 -->
  <section class="bg-white rounded-2xl p-4 mb-4 shadow-sm">
    <h2 class="text-sm font-bold text-slate-700 mb-2">✨ 도쿠시마 추천 명소 (클릭시 추가)</h2>
    <div class="flex flex-wrap gap-2" id="recommendations">
      <button onclick="addSpot('나루토 회오리바람 (Naruto Whirlpools)')" class="bg-indigo-50 text-indigo-700 text-xs px-3 py-1.5 rounded-full hover:bg-indigo-100 font-medium">+ 나루토 회오리바람</button>
      <button onclick="addSpot('오츠카 국제미술관')" class="bg-indigo-50 text-indigo-700 text-xs px-3 py-1.5 rounded-full hover:bg-indigo-100 font-medium">+ 오츠카 국제미술관</button>
      <button onclick="addSpot('비잔 산 로프웨이')" class="bg-indigo-50 text-indigo-700 text-xs px-3 py-1.5 rounded-full hover:bg-indigo-100 font-medium">+ 비잔 산 로프웨이</button>
      <button onclick="addSpot('아와오도리 회관')" class="bg-indigo-50 text-indigo-700 text-xs px-3 py-1.5 rounded-full hover:bg-indigo-100 font-medium">+ 아와오도리 회관</button>
      <button onclick="addSpot('이야 계곡 덩굴다리 (Kazurabashi)')" class="bg-indigo-50 text-indigo-700 text-xs px-3 py-1.5 rounded-full hover:bg-indigo-100 font-medium">+ 이야 계곡 덩굴다리</button>
      <button onclick="addSpot('도쿠시마 라멘 거리')" class="bg-indigo-50 text-indigo-700 text-xs px-3 py-1.5 rounded-full hover:bg-indigo-100 font-medium">+ 도쿠시마 라멘 거리</button>
    </div>
  </section>

  <!-- 장소 직접 입력 -->
  <section class="bg-white rounded-2xl p-4 mb-4 shadow-sm">
    <h2 class="text-sm font-bold text-slate-700 mb-2">📌 가고 싶은 곳 직접 입력</h2>
    <div class="flex gap-2">
      <input type="text" id="spotInput" placeholder="예: 도쿠시마역, 공항 등" class="flex-1 border rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <button onclick="addFromInput()" class="bg-indigo-600 text-white text-sm px-4 py-2 rounded-xl font-medium hover:bg-indigo-700">추가</button>
    </div>
  </section>

  <!-- 저장된 목적지 리스트 -->
  <section class="bg-white rounded-2xl p-4 mb-4 shadow-sm">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-sm font-bold text-slate-700">🗺️ 나의 여행 목록</h2>
      <button onclick="clearAll()" class="text-xs text-rose-500 hover:underline">전체 삭제</button>
    </div>
    <ul id="spotList" class="space-y-2">
      <!-- 동적 생성 항목 -->
    </ul>
  </section>

  <!-- 구글 맵 연동 버튼 -->
  <section class="mt-6">
    <button onclick="openGoogleMapsRoute()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl shadow-md transition flex items-center justify-center gap-2">
      <span>🗺️</span>
      <span>구글 맵 최적 동선 경로 보기</span>
    </button>
  </section>

  <script>
    let spots = JSON.parse(localStorage.getItem('tokushima_spots')) || [];

    function renderSpots() {
      const listEl = document.getElementById('spotList');
      listEl.innerHTML = '';
      
      if (spots.length === 0) {
        listEl.innerHTML = '<li class="text-xs text-slate-400 text-center py-4">등록된 장소가 없습니다. 위에서 추가해 보세요!</li>';
        return;
      }

      spots.forEach((spot, index) => {
        const li = document.createElement('li');
        li.className = 'flex justify-between items-center bg-slate-50 p-3 rounded-xl border text-sm';
        li.innerHTML = `
          <span class="font-medium text-slate-700">${index + 1}. ${spot}</span>
          <button onclick="removeSpot(${index})" class="text-slate-400 hover:text-rose-500 text-xs px-2 py-1">삭제</button>
        `;
        listEl.appendChild(li);
      });
    }

    function addSpot(name) {
      if (!spots.includes(name)) {
        spots.push(name);
        saveAndRender();
      }
    }

    function addFromInput() {
      const input = document.getElementById('spotInput');
      const val = input.value.trim();
      if (val) {
        addSpot(val);
        input.value = '';
      }
    }

    function removeSpot(index) {
      spots.splice(index, 1);
      saveAndRender();
    }

    function clearAll() {
      if (confirm('모든 장소를 삭제하시겠습니까?')) {
        spots = [];
        saveAndRender();
      }
    }

    function saveAndRender() {
      localStorage.setItem('tokushima_spots', JSON.stringify(spots));
      renderSpots();
    }

    function openGoogleMapsRoute() {
      if (spots.length === 0) {
        alert('동선을 생성할 장소를 먼저 추가해주세요!');
        return;
      }

      if (spots.length === 1) {
        const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('도쿠시마 ' + spots[0])}`;
        window.open(url, '_blank');
        return;
      }

      const origin = encodeURIComponent('도쿠시마 ' + spots[0]);
      const destination = encodeURIComponent('도쿠시마 ' + spots[spots.length - 1]);
      
      let waypoints = '';
      if (spots.length > 2) {
        const middleSpots = spots.slice(1, spots.length - 1).map(s => '도쿠시마 ' + s);
        waypoints = '&waypoints=' + encodeURIComponent(middleSpots.join('|'));
      }

      const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypoints}&travelmode=transit`;
      window.open(mapsUrl, '_blank');
    }

    // 초기 로드
    renderSpots();
  </script>
</body>
</html>
